# ============================================================
# Acuity Invest — Docker Compose (frontend + backend + MCP server)
# ============================================================
#
# Usage:
#   Development:  docker compose up --build
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Prerequisite: Copy .env.example to backend/.env and fill in your secrets.

services:
  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acuity-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost
      - DATABASE_PATH=/app/data/acuity.db
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
    networks:
      - acuity-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Frontend (nginx + SPA) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acuity-frontend
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - acuity-network

  # ---- MCP Server (Streamable HTTP) ----
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: acuity-mcp-server
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MCP_PORT=3002
      - DATABASE_PATH=/app/data/acuity.db
    ports:
      - "3002:3002"
    volumes:
      - backend-data:/app/data
    networks:
      - acuity-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local

networks:
  acuity-network:
    driver: bridge
